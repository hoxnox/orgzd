<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orgzd — {{if eq .Mode "new"}}new{{else}}edit{{end}}</title>
<style>
:root {
  --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
  --text: #d4d4d4; --muted: #666; --dim: #444;
  --accent: #5b9bd5; --red: #e06c75; --green: #98c379; --yellow: #e5c07b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
.wrap { max-width: 800px; margin: 0 auto; padding: 24px 16px; }
header h1 { font-size: 20px; color: var(--accent); font-weight: 600; }
header .date { font-size: 13px; color: var(--muted); margin-top: 2px; }
nav { margin-top: 12px; margin-bottom: 20px; }
nav a { color: var(--muted); text-decoration: none; margin-right: 20px; font-size: 13px; padding-bottom: 4px; }
nav a:hover { color: var(--text); }
nav a.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
form { display: flex; flex-direction: column; gap: 14px; max-width: 700px; }
form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
form input, form select, form textarea {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  padding: 7px 9px; border-radius: 3px; font-family: inherit; font-size: 14px;
}
form input:focus, form select:focus, form textarea:focus {
  border-color: var(--accent); outline: none;
}
form input[readonly] { color: var(--muted); cursor: default; }
form textarea {
  min-height: 240px; font-family: ui-monospace, monospace;
  font-size: 13px; line-height: 1.5; resize: vertical;
}
.row { display: flex; gap: 12px; }
.row label { flex: 1; }
.actions { display: flex; gap: 8px; align-items: center; }
button {
  background: var(--green); color: #111; border: none; border-radius: 4px;
  padding: 8px 22px; font-size: 13px; font-weight: 600; cursor: pointer;
}
button:hover { opacity: 0.9; }
button.cancel { background: var(--surface); color: var(--muted); }
.hint { color: var(--dim); font-size: 11px; text-transform: none; font-weight: 400; letter-spacing: 0; }
.err { color: var(--red); font-size: 12px; }
/* ── date picker ── */
.dp-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:1000; }
.dp-popup { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:14px; width:260px; box-shadow:0 8px 32px rgba(0,0,0,.5); }
.dp-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.dp-head span { font-size:14px; font-weight:600; }
.dp-nav { background:none; color:var(--text); border:none; cursor:pointer; font-size:15px; padding:2px 8px; border-radius:3px; }
.dp-nav:hover { background:var(--border); }
.dp-days { width:100%; }
.dp-days th { font-size:10px; color:var(--muted); font-weight:400; padding:2px 0; text-align:center; width:36px; }
.dp-days td { font-size:13px; text-align:center; padding:4px 0; cursor:pointer; border-radius:3px; }
.dp-days td:hover { background:var(--border); }
.dp-days td.dp-today { color:var(--yellow); font-weight:600; }
.dp-days td.dp-sel { background:var(--accent); color:#111; font-weight:600; }
.dp-foot { display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-top:8px; }
.dp-info { flex:1; font-size:11px; color:var(--dim); }
.dp-today, .dp-shortcut, .dp-clear { background:none; color:var(--muted); border:1px solid var(--border); border-radius:3px; padding:3px 10px; font-size:11px; cursor:pointer; font-weight:500; }
.dp-today:hover, .dp-shortcut:hover, .dp-clear:hover { color:var(--text); border-color:var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>orgzd</h1>
    <div class="date">{{.DateStr}}</div>
  </header>
  <nav>
    <a href="/">Agenda</a>
    <a href="/maintenance">Maintenance</a>
    <a href="/new"{{if eq .Mode "new"}} class="active"{{end}}>+ New</a>
  </nav>
  <form id="ef">
    <div class="row">
      {{if eq .Mode "new"}}
      <label>File
        <select name="file">
          {{range .Files}}<option{{if eq . $.Draft.File}} selected{{end}}>{{.}}</option>{{end}}
        </select>
      </label>
      {{else}}
      <label>File
        <input value="{{.Draft.File}}:{{.Draft.Line}}" readonly>
      </label>
      <input type="hidden" name="file" value="{{.Draft.File}}">
      <input type="hidden" name="line" value="{{.Draft.Line}}">
      {{end}}
      <label>State
        <select name="state">
          <option value=""{{if eq .Draft.State ""}} selected{{end}}>(none)</option>
          {{$cur := .Draft.State}}
          {{range .States}}<option{{if eq . $cur}} selected{{end}}>{{.}}</option>{{end}}
        </select>
      </label>
    </div>
    <label>Title
      <input name="title" value="{{.Draft.Title}}" required autofocus>
    </label>
    <label>Tags <span class="hint">space-separated</span>
      <input name="tags" value="{{.TagsStr}}" placeholder="vk school">
    </label>
    <div class="row">
      <label>Scheduled <span class="hint">YYYY-MM-DD [HH:MM] [+1w]</span>
        <input name="scheduled" value="{{.Draft.Scheduled}}" placeholder="2026-06-15 14:00 +1w">
      </label>
      <label>Deadline <span class="hint">YYYY-MM-DD [HH:MM]</span>
        <input name="deadline" value="{{.Draft.Deadline}}" placeholder="">
      </label>
    </div>
    <label>Body
      <textarea name="body">{{.Draft.Body}}</textarea>
    </label>
    <div class="actions">
      <button type="submit">{{if eq .Mode "new"}}Create{{else}}Save{{end}}</button>
      <a href="/" class="cancel"><button type="button" class="cancel">Cancel</button></a>
      <span class="err" id="err"></span>
    </div>
  </form>
</div>
<div id="dp" class="dp-overlay" style="display:none" onclick="dpHide(event)">
  <div class="dp-popup" onclick="event.stopPropagation()">
    <div class="dp-head">
      <button type="button" class="dp-nav" onclick="dpMonth(-1)">&larr;</button>
      <span id="dp-title"></span>
      <button type="button" class="dp-nav" onclick="dpMonth(1)">&rarr;</button>
    </div>
    <table class="dp-days" id="dp-grid"></table>
    <div class="dp-foot">
      <span id="dp-info" class="dp-info"></span>
      <button type="button" class="dp-today" onclick="dpPickToday()">Today</button>
      <button type="button" class="dp-shortcut" onclick="dpPickTomorrow()">Tomorrow</button>
      <button type="button" class="dp-shortcut" onclick="dpPickNextMon()">Next Mon</button>
      <button type="button" class="dp-clear" onclick="dpClear()">Clear</button>
    </div>
  </div>
</div>
<script>
var mode = {{.Mode}};

// ── date picker ──────────────────────────────────────────────────────
var dpInput = null;
var dpYear = 0, dpMonthIdx = 0;
var dpTarget = null; // which field: 'scheduled' or 'deadline'

function dpShow(input) {
  dpInput = input;
  dpTarget = input.name;
  var p = input.value.trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (p) {
    dpYear = parseInt(p[1],10);
    dpMonthIdx = parseInt(p[2],10) - 1;
  } else {
    var d = new Date();
    dpYear = d.getFullYear();
    dpMonthIdx = d.getMonth();
  }
  dpRender();
  document.getElementById('dp').style.display = '';
}

function dpHide(ev) {
  if (ev && ev.target !== ev.currentTarget) return;
  document.getElementById('dp').style.display = 'none';
  dpInput = null;
}

function dpMonth(delta) {
  dpMonthIdx += delta;
  if (dpMonthIdx > 11) { dpMonthIdx = 0; dpYear++; }
  if (dpMonthIdx < 0) { dpMonthIdx = 11; dpYear--; }
  dpRender();
}

var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function dpRender() {
  document.getElementById('dp-title').textContent = MONTHS[dpMonthIdx] + ' ' + dpYear;
  var grid = document.getElementById('dp-grid');
  grid.innerHTML = '';
  var first = (new Date(dpYear, dpMonthIdx, 1).getDay() + 6) % 7; // 0=Mon
  // day-of-week header
  var hdr = document.createElement('tr');
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(function(d) {
    var th = document.createElement('th'); th.textContent = d; hdr.appendChild(th);
  });
  grid.appendChild(hdr);
  // today reference
  var today = new Date();
  var tdY = today.getFullYear(), tdM = today.getMonth(), tdD = today.getDate();
  // currently set date
  var curD = -1;
  if (dpInput) {
    var m = dpInput.value.trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) curD = parseInt(m[3],10);
  }
  var daysInMonth = new Date(dpYear, dpMonthIdx+1, 0).getDate();
  var row = document.createElement('tr');
  // leading blanks
  for (var i=0; i<first; i++) { var td = document.createElement('td'); row.appendChild(td); }
  for (var d=1; d<=daysInMonth; d++) {
    var td = document.createElement('td');
    td.textContent = d;
    if (dpYear===tdY && dpMonthIdx===tdM && d===tdD) td.className = 'dp-today';
    if (dpYear===tdY && dpMonthIdx===tdM && d===curD) td.className = 'dp-sel';
    (function(day){ td.onclick = function(){ dpPick(day); }; })(d);
    row.appendChild(td);
    var dow = (first + d - 1) % 7;
    if (dow === 6 && d < daysInMonth) { grid.appendChild(row); row = document.createElement('tr'); }
  }
  grid.appendChild(row);
  // show repeater hint
  var info = document.getElementById('dp-info');
  var rpt = dpInput ? (dpInput.value.match(/[.+]+\d+[hdwmy]/) || [''])[0] : '';
  info.textContent = rpt || '';
}

function dpPick(day) {
  if (!dpInput) return;
  var val = '';
  if (day > 0) {
    var ds = dpYear + '-' + String(dpMonthIdx+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    // preserve time and repeater suffix from current value
    var cur = dpInput.value.trim();
    var time = (cur.match(/\d{1,2}:\d{2}/) || [''])[0];
    var rpt = (cur.match(/[.+]+\d+[hdwmy]/) || [''])[0];
    val = ds;
    if (time) val += ' ' + time;
    if (rpt) val += ' ' + rpt;
  }
  dpInput.value = val;
  // trigger input event so any listeners fire
  dpInput.dispatchEvent(new Event('input', {bubbles:true}));
  document.getElementById('dp').style.display = 'none';
  dpInput = null;
}

function dpPickToday() {
  var d = new Date();
  dpYear = d.getFullYear(); dpMonthIdx = d.getMonth();
  dpPick(d.getDate());
}

function dpPickTomorrow() {
  if (!dpInput) return;
  var d = new Date();
  d.setDate(d.getDate() + 1);
  dpInput.value = fmtDate(d);
  dpInput.dispatchEvent(new Event('input', {bubbles:true}));
  document.getElementById('dp').style.display = 'none';
  dpInput = null;
}

function dpPickNextMon() {
  if (!dpInput) return;
  var d = new Date();
  var dow = d.getDay();
  var daysUntil = dow === 0 ? 1 : 8 - dow;
  d.setDate(d.getDate() + daysUntil);
  dpInput.value = fmtDate(d);
  dpInput.dispatchEvent(new Event('input', {bubbles:true}));
  document.getElementById('dp').style.display = 'none';
  dpInput = null;
}

function fmtDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function dpClear() {
  if (dpInput) { dpInput.value = ''; dpInput.dispatchEvent(new Event('input', {bubbles:true})); }
  document.getElementById('dp').style.display = 'none';
  dpInput = null;
}

// wire up date inputs
document.querySelectorAll('input[name="scheduled"], input[name="deadline"]').forEach(function(inp) {
  inp.addEventListener('focus', function(){ dpShow(this); });
});

// ── form submit ───────────────────────────────────────────────────────
document.getElementById('ef').addEventListener('submit', function(e) {
  e.preventDefault();
  var fd = new FormData(this);
  var data = {};
  fd.forEach(function(v, k) { data[k] = v; });
  if (data.line) data.line = parseInt(data.line);
  var url = mode === 'new' ? '/api/new' : '/api/edit';
  var err = document.getElementById('err');
  err.textContent = '';
  fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }).then(function(r) {
    if (r.ok) window.location = '/';
    else r.text().then(function(t) { err.textContent = t.trim(); });
  });
});
</script>
</body>
</html>
